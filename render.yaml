# Blueprint do Render (plano gratuito) para o BACKEND do ReUse! + banco PostgreSQL.
#
# Como usar:
#   1. Publique esta pasta (ReUse - Final) em um repositório no GitHub.
#   2. No Render, clique em "New +" → "Blueprint" e aponte para o repositório.
#   3. O Render cria o banco e o web service. Depois do primeiro deploy, preencha
#      ORIGENS_PERMITIDAS com a URL do frontend na Vercel (ex.: https://reuse.vercel.app).
#
# O frontend Next.js NÃO entra aqui: ele é publicado na Vercel (veja o README).

databases:
  - name: reuse-postgres
    databaseName: reuse
    plan: free

services:
  - type: web
    name: reuse-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # npm install dispara o postinstall (prisma generate);
    # npm run build aplica as migrations e roda o seed idempotente.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reuse-postgres
          property: connectionString
      # O banco do Render não usa pooler separado: as migrations usam a mesma URL.
      - key: DATABASE_URL_UNPOOLED
        fromDatabase:
          name: reuse-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Preencher no painel do Render com a URL do frontend publicado.
      - key: ORIGENS_PERMITIDAS
        sync: false
      # Opcionais: credenciais do IBM watsonx Assistant.
      # Sem elas, o assistente Eco roda com o motor local, lendo a mesma skill.
      - key: WATSON_APIKEY
        sync: false
      - key: WATSON_URL
        sync: false
      - key: WATSON_ENVIRONMENT_ID
        sync: false
